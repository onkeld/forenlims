{% extends "base.html" %}
{% load i18n %}
{% block content %}
    <div class="card bg-base-100 w-96 shadow-sm">
        <div class="card-body">
            <h1 class="card-title">{% trans "Edit User" %}</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">{% trans "Edit User" %}</button>
            </form>
        </div>
        <div class="card-actions justify-end">
            <a href="{% url 'accounts:user_profile' pk=user.pk %}">{% trans "Back to User Profile" %}</a>
        </div>
    </div>
{% endblock content %}
