    {% load i18n %}
    {% if user.is_authenticated %}
        <div class="dropdown dropdown-end">
            <div tabindex="0" role="button" class="btn btn-ghost btn-sm gap-2">
                <div class="avatar placeholder">
                    <div class="bg-primary text-primary-content rounded-full w-7">
                        <span class="text-xs">{{ user.email|first|upper }}</span>
                    </div>
                </div>
                <span class="hidden sm:inline text-sm">{{ user.email }}</span>
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="w-4 h-4 opacity-60"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
            </div>
            <ul tabindex="0"
                class="dropdown-content menu menu-sm bg-base-100 rounded-box z-50 mt-2 w-48 shadow-lg border border-base-300">
                <li class="menu-title text-xs opacity-50 px-3 py-1">{{ user.email }}</li>
                <li>
                    <a href="{% url 'account_logout' %}" class="text-error">{% trans "Logout" %}</a>
                </li>
            </ul>
        </div>
    {% else %}
        <a href="{% url 'account_login' %}" class="btn btn-primary btn-sm">{% trans "Login" %}</a>
    {% endif %}
