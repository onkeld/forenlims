permissions:
  contents: read

name: Django CI
env:
  DJANGO_SECRET_KEY: ${{ secrets.SECRET_KEY }}
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  DJANGO_DEBUG: ${{ secrets.DJANGO_DEBUG }}
  POSTGRES_USER: forenlims
  POSTGRES_PASSWORD: forenlims
  POSTGRES_DB: forenlims_test
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    # PostgreSQL Service-Container
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forenlims
          POSTGRES_PASSWORD: forenlims
          POSTGRES_DB: forenlims_test
        ports:
          - 5432:5432
        # Health checks damit Tests erst starten wenn DB bereit ist
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure DJANGO_SECRET_KEY present (fallback for fork PRs)
        run: |
          if [ -z "${DJANGO_SECRET_KEY:-}" ]; then
            # Set a CI-only fallback secret (only visible in the run environment)
            echo "CI_DJANGO_SECRET_KEY=insecure-ci-secret-for-tests-only" >> $GITHUB_ENV
            echo "CI fallback DJANGO secret written to CI_DJANGO_SECRET_KEY"
          else
            echo "DJANGO_SECRET_KEY present (secret provided)"
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: |
          npm ci
          cd theme/static_src && npm ci && cd ..
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Set up Poetry
        uses: matrix-org/setup-python-poetry@5bbf6603c5c930615ec8a29f1b5d7d258d905aa4

      - name: Install dependencies
        run: poetry install
      - name: Debug environment
        run: |
          echo "=== PATH ==="
          echo $PATH
          echo "=== theme/ exists? ==="
          ls -la theme/ || echo "theme/ not found"
          echo "=== rimraf location ==="
          find . -name "rimraf" -type f 2>/dev/null
          echo "=== theme/static_src/node_modules/.bin ==="
          ls -la theme/static_src/node_modules/.bin/ 2>/dev/null || echo "not found"
      - name: Build Frontend Assets

        run: export PATH="./node_modules/.bin:./theme/static_src/node_modules/.bin:$PATH" && poetry run python manage.py tailwind build
      - name: Run Ruff
        run: poetry run ruff check .
      - name: Run djLint
        run: poetry run djlint --check .
      - name: Run Pytest with Coverage
        run: poetry run pytest
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production
        run: |
          # Add your deployment script or commands here
